limit_req_zone $binary_remote_addr zone=vh_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vh_reports:10m rate=5r/m;
server {
  listen 80;
  server_name _;
  client_max_body_size 16m;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  location ^~ /api/v1/admin/ { limit_req zone=vh_api burst=30 nodelay; limit_req_status 429; proxy_pass http://backend:8000; proxy_read_timeout 45s; }
  location ~ ^/api/public/video/[^/]+/report$ { limit_req zone=vh_reports burst=3 nodelay; limit_req_status 429; proxy_pass http://backend:8000; proxy_read_timeout 45s; }
  location / { proxy_pass http://backend:8000; proxy_read_timeout 45s; }
}
