services:
  backend:
    build: .
    env_file: .env
    environment:
      VIDEOHUB_DB: /app/data/video.db
      VIDEOHUB_BACKUPS: /app/backups
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      options: {max-size: "10m", max-file: "3"}
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${VIDEOHUB_BIND:-127.0.0.1}:${VIDEOHUB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}
