services:
  web:
    build: .
    env_file: .env
    environment:
      MC_DB: /app/data/management.db
      MC_BACKUPS: /app/backups
    volumes: ["./data:/app/data", "./backups:/app/backups", "./logs:/app/logs"]
    ports: ["${MC_BIND:-127.0.0.1}:${MC_PORT:-8090}:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      options: {max-size: "10m", max-file: "3"}
  scheduler:
    build: .
    command: ["python", "-m", "backend.jobs"]
    env_file: .env
    environment:
      MC_DB: /app/data/management.db
      MC_BACKUPS: /app/backups
    volumes: ["./data:/app/data", "./backups:/app/backups", "./logs:/app/logs"]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}
