<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management Center</title><link rel="stylesheet" href="/static/style.css"></head><body>
<section id="login" class="login"><form id="loginForm" class="panel"><div class="brand"><span class="logo">V</span><strong>Management Center</strong></div><h1>登录数据中心</h1><p class="muted">独立站点 · 统一运营</p><label>管理密码<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">登录</button><p id="loginError" role="alert"></p></form></section>
<div id="app" hidden><aside id="sidebar"><div class="brand"><span class="logo">V</span><div><strong>Management Center</strong><small>多站点数据中心</small></div></div><nav id="nav"></nav><footer>VideoHub · Control Plane</footer></aside><div class="shell"><header class="topbar"><button id="toggle" class="iconbtn" aria-label="折叠菜单">☰</button><span id="crumb">数据中心 / 仪表板</span><div class="grow"></div><label class="scope">站点范围<select id="scope"></select></label><button id="refresh" title="刷新页面">刷新</button><button id="logout">退出</button></header><main id="workspace"></main></div></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="closeDialog" class="closebtn" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><div id="notice" role="status" aria-live="polite" hidden></div><script src="/static/app.js" defer></script></body></html>
